name: Build and publish Hexo blog
on:
  push:
    branches: [hexo-source]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hexo-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx hexo clean && npm run build
      - uses: actions/checkout@v4
        with:
          ref: main
          path: deploy
          token: ${{ github.token }}
      - name: Publish generated site
        run: |
          find deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R public/. deploy/
          git -C deploy config user.name "github-actions[bot]"
          git -C deploy config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C deploy add -A
          git -C deploy diff --cached --quiet || (git -C deploy commit -m "Publish Hexo site" && git -C deploy push origin HEAD:main)
